<!doctype html><html lang="en"><meta charset="utf-8"><title>Biome hero review</title>
<style>body{background:#101920;color:#dce7e1;font:14px system-ui}button,select{padding:10px}canvas{max-width:100%}pre{white-space:pre-wrap}</style>
<h1>Biome hero review · matched captures</h1><select id="attempt"><option>baseline</option><option>attempt1</option><option>attempt2</option><option>attempt3</option></select><button id="run">Capture all ten biomes</button><button id="verify">Verify relief and motion</button><pre id="results">Ready</pre><canvas id="view"></canvas>
<script src="../math.js"></script><script src="../collection.js"></script><script src="../biomes.js"></script><script src="../hero-textures.js"></script><script src="../shaders.js"></script><script src="../collection-shader.js"></script><script src="../biome-shader.js"></script><script src="../preview-light.js"></script><script src="../renderer.js"></script>
<script>
const r=new SphereRenderer(document.querySelector('#view')),M=SphereMath,B=SphereBiomes,log=document.querySelector('#results');
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;log.textContent='Loading textures…';try{
 const base={...M.defaultState(),collection:true,routeShades:false,multipleWounds:false,starStation:false,shineField:false,atmosphere:1,exposure:-.15,antialias:0,playing:false,position:[0,0,M.AU-1],fov:70};await r.prepare(base);
 const configurations=[['1km-oblique',1,35,70,0,1],['1km-wide',1,90,95,0,1],['10km-transition',10,35,70,0,1],['20km-district',20,35,70,0,1],['1km-travel',1,35,70,8,1],['1km-clear',1,35,70,0,0]];
 for(let id=0;id<10;id++){const sheet=document.createElement('canvas');sheet.width=1920;sheet.height=1680;const ctx=sheet.getContext('2d');ctx.fillStyle='#101920';ctx.fillRect(0,0,sheet.width,sheet.height);
  for(let index=0;index<configurations.length;index++){const [name,alt,pitch,fov,shift,atmosphere]=configurations[index],q=M.norm([shift,0,M.AU]),a=pitch*Math.PI/180,s={...base,biome:id,position:M.mul(q,M.AU-alt),forward:M.norm(M.add(M.mul(q,Math.sin(a)),[0,Math.cos(a),0])),up:[0,0,-1],fov,atmosphere};s.up=M.basis(s.forward,[0,0,-1]).u;
   r.draw(s,1280,720,{exportFrame:true});if(r.error())throw Error('WebGL error');const blob=await new Promise(resolve=>r.canvas.toBlob(resolve,'image/png'));await fetch('/capture/'+document.querySelector('#attempt').value+'/'+B.catalog[id].id+'-'+name+'.png',{method:'POST',body:blob});
   const x=index%2*960,y=Math.floor(index/2)*560;ctx.drawImage(r.canvas,x,y+20,960,540);ctx.fillStyle='#dce7e1';ctx.font='14px system-ui';ctx.fillText(B.catalog[id].name+' · '+name,x+10,y+15);await new Promise(resolve=>setTimeout(resolve,30));
  }
  const blob=await new Promise(resolve=>sheet.toBlob(resolve,'image/png'));await fetch('/capture/'+document.querySelector('#attempt').value+'/'+B.catalog[id].id+'-sheet.png',{method:'POST',body:blob});log.textContent+='\nSaved '+B.catalog[id].name;
 }
 log.textContent+='\nCOMPLETE';
 }catch(e){log.textContent+='\nFAIL '+e.message;console.error(e);}finally{button.disabled=false;}};
document.querySelector('#verify').onclick=async()=>{const button=document.querySelector('#verify');button.disabled=true;log.textContent='Validating…';try{
 const base={...M.defaultState(),collection:true,routeShades:false,multipleWounds:false,starStation:false,shineField:false,atmosphere:0,exposure:-.15,antialias:0,playing:false,position:[0,0,M.AU-1],forward:M.norm([0,.7,.7]),up:[0,0,-1],fov:70};await r.prepare(base);if(!r.heroes.status.every(x=>x==='ready'))throw Error('Hero layers missing');
 const gl=r.gl,render=s=>{r.draw(s,320,180,{exportFrame:true});const p=new Uint8Array(320*180*4);gl.readPixels(0,0,320,180,gl.RGBA,gl.UNSIGNED_BYTE,p);if(r.error())throw Error('WebGL error');return p;};
 for(let id=0;id<10;id++){const on=render({...base,biome:id,surfaceRelief:true}),off=render({...base,biome:id,surfaceRelief:false});let diff=0;for(let i=0;i<on.length;i+=4)for(let c=0;c<3;c++)diff+=Math.abs(on[i+c]-off[i+c]);diff/=320*180*3;if(diff<.005||diff>25)throw Error('Relief response '+id+' '+diff);
  const a=render({...base,biome:id,viewMode:'objectid'}),b=render({...base,biome:id,viewMode:'objectid',surfaceRelief:false});if(!a.every((v,i)=>v===b[i]))throw Error('Relief changed geometry');
  let maxStep=0;for(const altitude of [1,4,6,8,10,18,24,32,600,1000,1800]){const first=render({...base,biome:id,position:[0,0,M.AU-altitude-.00001]}),second=render({...base,biome:id,position:[0,0,M.AU-altitude+.00001]});let mean=0;for(let i=0;i<first.length;i++)mean+=Math.abs(first[i]-second[i]);mean/=first.length;maxStep=Math.max(mean,maxStep);if(mean>1)throw Error('Discontinuous altitude response '+id+' '+altitude+' '+mean);}
  const sheet=document.createElement('canvas');sheet.width=1920;sheet.height=1680;const ctx=sheet.getContext('2d');for(let frame=0;frame<6;frame++){const shift=2.3+frame*.08,q=M.norm([shift,0,M.AU]),state={...base,biome:id,position:M.mul(q,M.AU-1),forward:M.norm(M.add(q,[0,1,0])),atmosphere:1};r.draw(state,960,540,{exportFrame:true});const x=frame%2*960,y=Math.floor(frame/2)*560;ctx.drawImage(r.canvas,x,y+20,960,540);ctx.fillStyle='#dce7e1';ctx.font='14px system-ui';ctx.fillText(B.catalog[id].name+' · lateral travel '+shift.toFixed(2)+' km',x+10,y+15);}
  const blob=await new Promise(resolve=>sheet.toBlob(resolve,'image/png'));await fetch('/capture/'+document.querySelector('#attempt').value+'/'+B.catalog[id].id+'-motion.png',{method:'POST',body:blob});const remote=document.createElement('canvas');remote.width=1920;remote.height=1680;const rc=remote.getContext('2d');for(let frame=0;frame<6;frame++){const altitude=[100,300,600,900,1200,1800][frame];r.draw({...base,biome:id,position:[0,0,M.AU-altitude],atmosphere:1},960,540,{exportFrame:true});const x=frame%2*960,y=Math.floor(frame/2)*560;rc.drawImage(r.canvas,x,y+20,960,540);rc.fillStyle='#dce7e1';rc.font='14px system-ui';rc.fillText(B.catalog[id].name+' · '+altitude+' km',x+10,y+15);}const remoteBlob=await new Promise(resolve=>remote.toBlob(resolve,'image/png'));await fetch('/capture/'+document.querySelector('#attempt').value+'/'+B.catalog[id].id+'-remote.png',{method:'POST',body:remoteBlob});
  r.draw({...base,biome:id,forward:M.norm([0,Math.cos(.21),Math.sin(.21)]),atmosphere:1,fov:95},1280,720,{exportFrame:true});const grazing=await new Promise(resolve=>r.canvas.toBlob(resolve,'image/png'));await fetch('/capture/'+document.querySelector('#attempt').value+'/'+B.catalog[id].id+'-grazing.png',{method:'POST',body:grazing});
  log.textContent+='\nPASS '+B.catalog[id].name+' relief mean '+diff.toFixed(3)+' RGB, geometry unchanged, max mean altitude step '+maxStep.toFixed(4);await new Promise(resolve=>setTimeout(resolve,20));
 }
 log.textContent+='\nALL HERO CHECKS PASSED';
 }catch(e){log.textContent+='\nFAIL '+e.message;console.error(e);}finally{button.disabled=false;}};
</script></html>
