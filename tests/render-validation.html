<!doctype html><html lang="en"><meta charset="utf-8"><title>Observatory integration checks</title>
<style>body{background:#101920;color:#dce7e1;font:14px monospace}button{padding:12px}iframe{width:1100px;height:800px;border:0}pre{white-space:pre-wrap}.gallery{display:flex;flex-wrap:wrap}.gallery figure{margin:8px}.gallery img{width:240px}</style>
<h1>Observatory integration checks</h1><button id="run">Run integration checks</button><pre id="results">Ready</pre><div class="gallery"></div><iframe src="../index.html" title="Observatory under test"></iframe>
<script>
const output=document.querySelector('#results');let lines=[];const log=x=>{lines.push(x);output.textContent=lines.join('\n');};const check=(condition,message)=>{if(!condition)throw Error(message);log('PASS '+message);};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;lines=[];document.querySelector('.gallery').replaceChildren();
 try{const win=document.querySelector('iframe').contentWindow,A=win.SphereApp,M=win.SphereMath,B=win.SphereBiomes,r=A.renderer,gl=r.gl;A.setBusy(true);
  const base={...M.defaultState(),collection:false,shadeEnabled:false,breachEnabled:false,starfield:false,antialias:0,atmosphere:1,position:[0,0,M.AU-1],forward:M.norm([0,.3,1]),up:[0,1,0],fov:65,exposure:.4,playing:false};
  await r.prepare(base);check(r.biomes.status.every(x=>x==='ready'),'all ten texture sets decode and upload (30 layers)');
  const render=s=>{r.draw(s,321,181,{exportFrame:true});const pixels=new Uint8Array(321*181*4);gl.readPixels(0,0,321,181,gl.RGBA,gl.UNSIGNED_BYTE,pixels);if(r.error())throw Error('WebGL error');return pixels;};
  const means=[],signatures=[];
  for(let id=0;id<10;id++){const pixels=render({...base,biome:id});let sum=0;const colors=new Set();for(let i=0;i<pixels.length;i+=4){sum+=pixels[i]+pixels[i+1]+pixels[i+2];colors.add(pixels[i]+','+pixels[i+1]+','+pixels[i+2]);}means.push(sum/(321*181*3));signatures.push([...pixels.slice(10000,10100)].join(','));check(colors.size>100,B.catalog[id].name+' has resolved texture detail');
   const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=r.canvas.toDataURL();caption.textContent=B.catalog[id].name;figure.append(img,caption);document.querySelector('.gallery').append(figure);
  }
  check(new Set(signatures).size===10,'ten distinct rendered biome surfaces');check(means[3]>means[0]+20,'Winter Hell remains brighter than Dark Age Forest');
  const center=s=>{const p=render(s),i=(90*321+160)*4;return [...p.slice(i,i+3)];};const p0=center({...base,biome:0,forward:[0,0,1]}),p1=center({...base,biome:0,position:[.001,0,M.AU-1],forward:M.norm([-.001,0,1])});check(p0.every((v,i)=>Math.abs(v-p1[i])<=3),'one-metre camera rebase preserves a fixed surface point');
  for(const h of [6,18,60,180,600,1800]){const a=center({...base,biome:2,atmosphere:0,position:[0,0,M.AU-h-.0001],forward:[0,0,1]}),b=center({...base,biome:2,atmosphere:0,position:[0,0,M.AU-h+.0001],forward:[0,0,1]});check(a.every((v,i)=>Math.abs(v-b[i])<=3),'continuous GPU LOD at '+h+' km');}
  const idsA=render({...base,viewMode:'objectid',biome:0}),idsB=render({...base,viewMode:'objectid',biome:9,textureDetail:false,biomeAtmosphere:false});check(idsA.every((v,i)=>v===idsB[i]),'biomes and haze preserve geometric diagnostic IDs');
  render({...base,projection:'panorama',biome:9});check(true,'panorama shader and texture derivatives');
  for(const h of [1000,999,1001]){const s={...base,position:[0,0,M.AU-h],forward:M.norm([1,0,.2]),up:[0,1,0]};A.setState(s);const before=A.getState(),leveled=A.autoLevelIfNearSurface(),after=A.getState();check(leveled===(h<=1000),'auto-level threshold at '+h+' km');check(before.position.every((v,i)=>v===after.position[i])&&before.forward.every((v,i)=>Math.abs(v-after.forward[i])<1e-12),'auto-level preserves position and forward direction at '+h+' km');if(h<=1000)check(M.dot(after.up,[0,0,-1])>.95,'local up points away from shell');}
  const poseBefore=A.getState();win.document.querySelector('#seeSurface').click();const surface=A.getState();check(Math.abs(surface.radius-M.length(surface.position)-3)<.001&&surface.speed===1,'See surface descends to 3 km and sets exploration speed');win.document.querySelector('#seeSurface').click();const returned=A.getState();check(JSON.stringify(returned.position)===JSON.stringify(poseBefore.position)&&returned.fov===poseBefore.fov&&returned.speed===poseBefore.speed,'Return to view restores the original camera and speed');
  const landings=[];for(const q of [M.axis(0,-120),M.axis(0,0),M.axis(0,120)]){const position=M.mul(M.axis(28,-60),M.AU*.08);A.setState({...base,collection:true,multipleWounds:false,position,forward:M.norm(M.sub(M.mul(q,M.AU),position))});win.document.querySelector('#seeSurface').click();const landed=A.getState();check(M.length(M.sub(M.norm(landed.position),q))<1e-9,'See surface lands beneath the crosshair');landings.push(B.region(M.norm(landed.position),landed));win.document.querySelector('#seeSurface').click();}check(new Set(landings).size>=2,'aiming at different coloured regions visits different biomes');
  const ui=win.document;check(ui.querySelector('.tabs button').textContent==='Explore'&&!ui.querySelector('#camera').hidden,'Explore is the initial control panel');check(ui.querySelectorAll('.journeys button').length===6,'six travel controls replace the old preset strip');
  const unchanged=s=>JSON.stringify(Object.fromEntries(Object.entries(s).filter(([k])=>!['position','forward','up','fov','speed','projection'].includes(k))));
  for(const name of ['overview','shades','wounds','station']){A.setState({...base,collection:true,era:'after',multipleWounds:true,routeShades:true,time:2468,exposure:1.2,biome:-1});const before=unchanged(A.getState());ui.querySelector('[data-destination="'+name+'"]').click();check(unchanged(A.getState())===before,name+' travel preserves world, time, light and quality');check(A.getState().projection==='perspective','travel uses a photographic lens');}
  A.setState({...base,collection:true,biome:-1});for(let id=0;id<10;id++){ui.querySelector('#biomeDestination').value=String(id);ui.querySelector('#visitBiome').click();const s=A.getState();check(B.region(M.norm(s.position),s)===id&&!M.inBreach(M.norm(s.position),s),'biome expedition reaches '+B.catalog[id].name);}
  for(const tab of ['scene','lighting','photo','camera']){ui.querySelector('[data-tab="'+tab+'"]').click();check(!ui.getElementById(tab).hidden,tab+' controls open');}check(ui.querySelector('#previewFps').closest('#lighting')&&ui.querySelector('#capture').closest('#photo'),'quality and capture controls have consistent homes');
  const light=r.previewLight,s={...base,collection:true,playing:true,time:12345};light.sample(s);s.time+=60;await new Promise(resolve=>setTimeout(resolve,120));light.sample(s);await new Promise(resolve=>setTimeout(resolve,250));check(!light.pending&&light.sampleTime===s.time,'worker completes current light request');s.playing=false;s.time+=1;const actual=light.sample(s),expected=win.SphereCollection.cavity(s);check(actual.every((v,i)=>Math.abs(v-expected[i])<1e-12),'paused light is exact, including changes inside throttle interval');
  r.draw({...base,biome:8},1920,1080,{exportFrame:true});const blob=await new Promise(resolve=>r.canvas.toBlob(resolve,'image/png')),bitmap=await createImageBitmap(blob);check(bitmap.width===1920&&bitmap.height===1080&&blob.size>10000,'PNG export encodes requested dimensions');bitmap.close();
  // Actual animation cadence after warm-up, measured without synchronous readback.
  const doc=win.document;document.querySelector('iframe').scrollIntoView();win.spherePreviewSuspended=false;A.setState({...base,collection:true,playing:true,timeRate:600});doc.querySelector('#previewFps').value='60';doc.querySelector('#previewFps').onchange();A.setBusy(false);await new Promise(resolve=>setTimeout(resolve,500));const original=r.draw.bind(r),times=[],hostFrames=[];let countHost=true;const hostTick=t=>{hostFrames.push(t);if(countHost)requestAnimationFrame(hostTick);};requestAnimationFrame(hostTick);r.draw=(...args)=>{times.push(performance.now());return original(...args);};await new Promise(resolve=>setTimeout(resolve,2200));r.draw=original;countHost=false;A.setState({...A.getState(),playing:false});const intervals=times.slice(1).map((t,i)=>t-times[i]).sort((a,b)=>a-b);log('LIVE '+JSON.stringify({hidden:doc.hidden,suspended:win.spherePreviewSuspended,hostFrames:hostFrames.length,frames:times.length,medianMs:intervals[Math.floor(intervals.length/2)],p95Ms:intervals[Math.floor(intervals.length*.95)],cpuMs:r.cpuMs,gpuMs:r.gpuMs}));if(times.length>90)check(true,'live animation exceeds 40 FPS on this machine');else log('NOTE embedded viewport cadence is low; GPU timings and CPU submission are measured separately. A sustained 60 FPS has not been verified by this embedded test.');
  await new Promise(resolve=>setTimeout(resolve,500));let idleDraws=0;r.draw=(...args)=>{idleDraws++;return original(...args);};await new Promise(resolve=>setTimeout(resolve,500));r.draw=original;check(idleDraws===0,'settled paused view renders no frames');
  log('ALL CHECKS PASSED');
 }catch(e){log('FAIL '+e.message);console.error(e);}finally{document.querySelector('iframe').contentWindow.SphereApp?.setBusy(false);document.querySelector('#run').disabled=false;}
};
</script></html>
