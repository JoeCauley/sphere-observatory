<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Border Biome · Builder freight and maintenance</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#263237;color:#f0f1e9;font:14px system-ui,sans-serif}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:absolute;left:max(.7rem,env(safe-area-inset-left));bottom:max(.7rem,env(safe-area-inset-bottom));max-width:calc(100% - 1.4rem);padding:.55rem .75rem;background:#101b21df;border:1px solid #85908a77;border-radius:5px}summary{cursor:pointer;font-variant-numeric:tabular-nums}#controls{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.55rem}button,select{color:inherit;background:#29383a;border:1px solid #83938c;border-radius:3px;padding:.38rem .45rem;font:inherit}button:disabled,select:disabled{opacity:.5}small{display:block;margin-top:.5rem;color:#c4cfca}#touch{position:absolute;right:.7rem;bottom:4.2rem;display:none;grid-template-columns:repeat(3,2.65rem);gap:.18rem}#touch button{touch-action:none;user-select:none;background:#172628cc}@media(pointer:coarse){#touch{display:grid}#hud{font-size:12px}}
</style></head><body><canvas id="scene" tabindex="0" aria-label="Builder transport, drag to look"></canvas>
<details id="hud" open><summary id="readout">Surveying Builder station…</summary><div id="controls"><label>Board <select id="class"></select></label><button id="mode">Fly</button><label>Travel pace <select id="pace"><option value="1">1×</option><option value="16">16×</option><option value="128">128×</option></select></label><button id="bypass" hidden>Operate drainage bypass</button><output id="drainLevels" hidden aria-label="Channel levels"></output><button id="retry" hidden>Retry Atlas</button></div><small id="hint">WASD to move · drag or arrows to look · Q/E down/up · Shift faster · Space + E lift off · F land · change scale on an outside apron. The drainage handwheel is 42 m inside each service door, beside the pipe.</small></details>
<div id="touch" aria-label="Movement"><button data-key="KeyE">↑</button><button data-key="KeyW">W</button><button data-key="KeyQ">↓</button><button data-key="KeyA">A</button><button data-key="KeyS">S</button><button data-key="KeyD">D</button></div>
<script type="module" src="./pack.mjs"></script></body></html>
