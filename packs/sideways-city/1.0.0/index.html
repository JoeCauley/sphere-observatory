<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Sphere · The Sideways City</title>
<style>
 html,body{margin:0;height:100%;background:#0b0d10;color:#efe6d8;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
 canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:0}
 #panel{position:fixed;left:16px;top:16px;max-width:300px;background:#141a20e6;border:1px solid #ffffff22;border-radius:10px;padding:14px 16px}
 #panel h1{font:600 20px/1.2 Georgia,serif;margin:2px 0 6px} #panel p{margin:6px 0;opacity:.85}
 .eyebrow{font-size:11px;letter-spacing:.14em;opacity:.6}
 button{background:#22303a;color:inherit;border:1px solid #ffffff2e;border-radius:6px;padding:6px 10px;margin:4px 4px 0 0;cursor:pointer}
 button:hover{background:#2c3e4b}
 #foot{position:fixed;left:0;right:0;bottom:0;padding:8px 16px;background:#0b0d10cc;display:flex;gap:14px;align-items:center;font-size:12px}
 #mode{font-weight:700;letter-spacing:.1em} #status{opacity:.85;flex:1} #error{color:#ffb4a0}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="The Sideways City. WASD walks, drag to look."></canvas>
<section id="panel">
 <div class="eyebrow">SPHERE · BIOME</div>
 <h1>The Sideways City</h1>
 <p>A city without end, built for people fifty feet across who walk sideways. Nobody is home. Their curbs are your walls; their ramps are your roads.</p>
 <p id="where"></p>
 <button id="lift">Lift off · Space</button><button id="land">Land · F</button><br>
 <button id="save">Save this place</button><button id="back">Return to saved</button><br>
 <button id="leavePack">Return to Observatory</button>
 <p id="error"></p>
</section>
<div id="foot"><span id="mode">WALK</span><span id="status">Starting…</span><span id="perf"></span></div>
<script type="module" src="city.js"></script>
</body>
</html>
