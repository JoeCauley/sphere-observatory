name: Verify current Explore controls and native transition regressions
on:
  push:
    branches: [qa/transition-film-archive-44870610208]
    paths: [.github/workflows/verify-transition-motion.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      SPHERE_NATIVE_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: node tests/geographic-flight-browser.cjs
      - run: node tests/surface-architecture-browser.cjs
      - run: node tests/violet-flight-browser.cjs
      - run: node tests/asset-loading-browser.cjs
