name: Check the first supported physics step after a tunnel
on:
  push:
    branches: [qa/grounded-transition-films]
    paths: [.github/workflows/grounded-step.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node tests/ground-chunks.cjs
