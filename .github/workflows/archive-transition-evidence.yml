name: Archive the complete transition survey
on:
  push:
    branches: [qa/transition-film-archive-44870610208]
    paths: [.github/workflows/archive-transition-evidence.yml]
permissions:
  actions: read
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      RECORDING_RUN: "44871660792"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Wait for complete recordings
        run: gh run watch "$RECORDING_RUN" --interval 45 --compact
      - name: Download all camera traces and films
        run: gh run download "$RECORDING_RUN" -D "$RUNNER_TEMP/transitions"
      - run: python -m pip install numpy opencv-python-headless Pillow imageio-ffmpeg
      - name: Verify the routes, encode demonstrations and create the archive
        run: python tools/assemble-transition-review.py "$RUNNER_TEMP/transitions" "$RUNNER_TEMP/edition"
      - name: Publish the complete recording archive
        run: |
          gh release create "transition-films-$RECORDING_RUN" "$RUNNER_TEMP/edition/Sphere-Transition-Films.zip" "$RUNNER_TEMP/edition/receipt.json" --target 12c3cdbb460b53fcf4891f5f378488733d3a3b8e --title "Biome transition films and camera traces" --notes "All 48 continuous recordings from the hosted verification run, their camera traces, frame analyses, review sheets and file checksums. The runtime build is identified by the tag." --latest=false
