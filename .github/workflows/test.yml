name: Observatory checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  numerical-and-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:pack && npm run test:industry && npm run test:pods
      - run: npm run test:surface
      - run: npm run test:gallery

  browser:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [test:http-restart, test:restart, test:outfall, test:surface:browser, test:industry:roof, test:industry:transfer, test:contract, test:stage-arrival, test:transit, test:border:browser]
        include:
          - suite: test:walks:browser
            walk_shard: 1/3
          - suite: test:walks:browser
            walk_shard: 2/3
          - suite: test:walks:browser
            walk_shard: 3/3
    env:
      SPHERE_WALK_SHARD: ${{ matrix.walk_shard }}
      SPHERE_NATIVE_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      SPHERE_CONTRACT_HEADLESS: '1'
      SPHERE_CONTRACT_TIMEOUT_MS: '120000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ${{ matrix.suite }}
